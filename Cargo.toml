[package]
name = "netindex"
version = "2.0.2"
edition = "2024"
rust-version = "1.95"
description = "Immutable IP-range and ASN indexes with borrowed payloads"
readme = "README.md"
repository = "https://github.com/0xARYA/netindex"
license = "MIT OR Apache-2.0"
keywords = ["ip", "cidr", "asn", "index"]
categories = ["data-structures", "network-programming"]

[package.metadata.docs.rs]
all-features = true

[features]
codec = ["shared-values"]
external-sort = ["dep:tempfile"]
mmdb = ["dep:maxminddb"]
mmap = ["dep:memmap2"]
simd = ["dep:simdutf8"]
shared-values = []

[dependencies]
hashbrown = { version = "0.17.1", default-features = false, features = ["inline-more"] }
maxminddb = { version = "0.32", optional = true, default-features = false }
memmap2 = { version = "0.9.11", optional = true }
simdutf8 = { version = "0.1.5", optional = true }
tempfile = { version = "3", optional = true }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
compio = { version = "0.19.2", default-features = false, features = ["runtime", "polling"] }
criterion = { version = "0.8.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }

[[bench]]
name = "index"
harness = false

[[bench]]
name = "mmdb"
harness = false
required-features = ["codec", "mmdb", "mmap", "external-sort"]

[[bench]]
name = "codec"
harness = false
required-features = ["codec", "mmdb", "mmap"]

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["."]
exclude = ["fuzz", "benchmarks"]

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
# String slices also require UTF-8 boundary checks.
string_slice = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
allow_attributes_without_reason = "deny"
unused_result_ok = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
unreachable_pub = "warn"
unused_qualifications = "warn"
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[profile.release]
codegen-units = 1
