[package]
name = "netindex-learned-study"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
simd = ["netindex/simd"]

[profile.release]
codegen-units = 1

[dependencies]
netindex = { package = "netindex-learned-core", path = "../../target/learned/library", features = ["mmap"] }
libc = "=0.2.190"
serde_json = "=1.0.151"

[[bin]]
name = "netindex-learned-study"
path = "../../target/learned/main.rs"

[[bin]]
name = "netindex-learned-fixtures"
path = "../../target/learned/fixtures.rs"
