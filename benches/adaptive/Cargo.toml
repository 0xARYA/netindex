[package]
name = "netindex-adaptive-study"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
simd = ["netindex/simd"]

[profile.release]
codegen-units = 1

[dependencies]
netindex = { package = "netindex-adaptive-core", path = "../../target/adaptive/library", features = ["mmap"] }
libc = "=0.2.190"
serde_json = "=1.0.151"

[[bin]]
name = "netindex-adaptive-study"
path = "../../target/adaptive/main.rs"
